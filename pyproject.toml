[project]
name = "stockscan"
version = "0.1.0"
description = "Personal daily 'hot stocks' scanner and quant research tool. Research and alerting only: it never places orders."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.16.2",
    "typer>=0.29.1",
    "tzdata>=2026.6",
    "yfinance>=1.8.0",
]

[project.scripts]
scan = "stockscan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockscan"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PT", "RUF", "ANN"]
ignore = [
    "ANN401", # Any is fine at the edges (pandas, JSON payloads)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"src/stockscan/cli.py" = ["B008"] # typer.Option(...) in defaults is the typer idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"] # a warning in our own code paths is a bug waiting to happen

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]
